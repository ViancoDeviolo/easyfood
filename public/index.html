<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EasyFood</title>
  <meta name="theme-color" content="#C8231E" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%2716%27 fill=%27%23C8231E%27/%3E%3Ctext x=%2716%27 y=%2721.5%27 font-size=%2713%27 font-family=%27Arial%27 font-weight=%27800%27 fill=%27%23FFB400%27 text-anchor=%27middle%27%3EEF%3C/text%3E%3C/svg%3E" />
  <!-- Fonte de títulos e texto; sem internet, o CSS cai para a fonte do sistema -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="#/" class="brand" aria-label="EasyFood, página inicial">
        <span class="brand-mark" aria-hidden="true">EF</span>
        <span class="brand-name">EasyFood</span>
      </a>
      <nav class="nav" id="nav"></nav>
    </div>
  </header>

  <main class="container" id="view" tabindex="-1"></main>

  <footer class="footer">
    <div class="container">
      <span>Projeto EasyFood, Software Architecture &amp; Design Patterns, UniFECAF 2026</span>
      <span class="footer-db" id="db-status"></span>
    </div>
  </footer>

  <!-- Modal de login / cadastro -->
  <dialog id="auth-dialog" class="dialog">
    <form method="dialog" class="dialog-close-form">
      <button class="icon-btn" aria-label="Fechar">×</button>
    </form>
    <div class="tabs" role="tablist">
      <button type="button" class="tab active" data-auth-tab="login">Entrar</button>
      <button type="button" class="tab" data-auth-tab="register">Criar conta</button>
    </div>

    <form id="login-form" class="form">
      <label>E-mail <input name="email" type="email" required autocomplete="email" /></label>
      <label>Senha <input name="password" type="password" required autocomplete="current-password" /></label>
      <button class="btn btn-primary" type="submit">Entrar</button>
      <p class="hint">Demonstração: <code>cliente@easyfood.com</code> ou <code>dono@easyfood.com</code>, senha <code>easyfood123</code></p>
    </form>

    <form id="register-form" class="form" hidden>
      <label>Nome <input name="name" required minlength="2" autocomplete="name" /></label>
      <label>E-mail <input name="email" type="email" required autocomplete="email" /></label>
      <label>Senha <input name="password" type="password" required minlength="6" autocomplete="new-password" /></label>
      <button class="btn btn-primary" type="submit">Criar conta</button>
    </form>
    <p class="form-error" id="auth-error" role="alert"></p>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
